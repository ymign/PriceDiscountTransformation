name: rule-center-ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-test-audit:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Validate release assets
        shell: pwsh
        run: .\scripts\validate-release-assets.ps1

      - name: Restore
        run: dotnet restore .\src\Pricing.RuleCenter.slnx

      - name: Build
        run: dotnet build .\src\Pricing.RuleCenter.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test .\src\Pricing.RuleCenter.slnx --no-restore --configuration Release --verbosity normal

      - name: Oracle integration tests
        if: ${{ secrets.PRICING_ORACLE_CONNECTION_STRING != '' }}
        shell: pwsh
        env:
          PRICING_ORACLE_CONNECTION_STRING: ${{ secrets.PRICING_ORACLE_CONNECTION_STRING }}
        run: .\scripts\run-oracle-integration-tests.ps1

      - name: Vulnerability audit
        run: dotnet list .\src\Pricing.RuleCenter.slnx package --vulnerable --include-transitive
